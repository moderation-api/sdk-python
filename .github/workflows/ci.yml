# Maintained in moderation-api/sdk-generator (custom/python). Edits here are overwritten.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.9.13"
      - run: uv sync --group dev
      - run: uv run pylint --rcfile=pylintrc src
      - run: uv run mypy src
      - run: uv run pyright src
      - run: uv build
      - name: Import the package
        run: uv run python -c "from moderation_api import ModerationAPI; from moderation_api.webhook_signature import construct_event"
